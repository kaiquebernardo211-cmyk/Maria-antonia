<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário, Maria Antônia!</title>
<style>
body{
  margin:0;
  font-family:'Comic Sans MS', Arial, sans-serif;
  background:linear-gradient(135deg,#ff69b4,#ff1493,#dda0dd);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:white;
  text-align:center;
  overflow:hidden;
}
.card{
  background:rgba(255,255,255,.25);
  padding:40px 30px;
  border-radius:20px;
  max-width:500px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(255,255,255,.3);
  z-index:10;
  position:relative;
}
h1{ font-size:2.5em; margin:10px 0; }
h2{ font-size:2.2em; margin:5px 0; color:yellow; text-shadow:2px 2px 4px #000; }
button{
  padding:18px 30px;
  font-size:22px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  background:yellow;
  color:#8a2be2;
  font-weight:bold;
  margin-top:20px;
  position:relative;
  z-index:20;
}
button:active{ transform:scale(0.95); }
.balao{
  position:absolute;
  bottom:-100px;
  border-radius:50%;
  animation:subir 8s infinite linear;
  z-index:1;
}
@keyframes subir{ to{ transform:translateY(-120vh); } }
</style>
</head>
<body>

<div class="card">
  <h1>🎉 Feliz Aniversário! 🎂</h1>
  <h2>Maria Antônia</h2>
  <h3>7 aninhos 💖</h3>
  <p>Que seu dia seja cheio de alegria e muitos presentes!</p>
  <button id="btnSurpresa">🎁 Abrir Surpresa</button>
</div>

<script>
// Criar balões
for(let i=0; i<15; i++){
  let balao = document.createElement('div');
  balao.className = 'balao';
  balao.style.left = Math.random()*100 + 'vw';
  balao.style.background = `hsl(${Math.random()*360}, 100%, 70%)`;
  balao.style.animationDelay = Math.random()*5 + 's';
  balao.style.width = 30 + Math.random()*20 + 'px';
  balao.style.height = 50 + Math.random()*20 + 'px';
  document.body.appendChild(balao);
}

// Função do botão
document.getElementById('btnSurpresa').addEventListener('click', function(){
  alert('Parabéns, Maria Antônia! Que você tenha um aniversário maravilhoso e cheio de magia! 🎁✨');
  
  // Confete
  for(let i=0; i<100; i++){
    let confete = document.createElement('div');
    confete.style.position='fixed';
    confete.style.left=Math.random()*100+'vw';
    confete.style.top='-10px';
    confete.style.width='10px';
    confete.style.height='10px';
    confete.style.background=`hsl(${Math.random()*360},100%,50%)`;
    confete.style.zIndex='30';
    confete.style.animation='subir 3s linear reverse';
    document.body.appendChild(confete);
    setTimeout(()=>confete.remove(),3000);
  }
});
</script>

</body>
</html>
