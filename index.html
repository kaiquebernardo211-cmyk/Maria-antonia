<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário, Maria Antônia!</title>
<style>
body{
margin:0;
font-family:'Comic Sans MS', Arial, sans-serif;
background:linear-gradient(135deg,#ff69b4,#6a5acd,#dda0dd);
background-attachment: fixed;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
text-align:center;
overflow:hidden;
padding:20px;
}
.card{
background:rgba(255,255,255,.2);
padding:40px 30px;
border-radius:20px;
max-width:500px;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(255,255,255,.3);
animation:brilhar 2s infinite alternate;
z-index:2;
}
h1{ font-size:2.5em; margin:10px 0; text-shadow:2px 2px 8px rgba(0,0,0,0.3); }
h2{ font-size:2.2em; margin:5px 0; color:yellow; }
h3{ font-size:1.6em; margin:5px 0; }
p{ font-size:1.2em; line-height:1.5; }
button{
padding:16px 28px;
font-size:20px;
border:none;
border-radius:15px;
cursor:pointer;
background:yellow;
color:#6a5acd;
font-weight:bold;
margin-top:20px;
transition:0.3s;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
button:hover{ transform:scale(1.1); }
.balao{
position:absolute;
bottom:-100px;
border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
animation:subir 10s infinite linear;
opacity:0.8;
z-index:1;
}
.confete{
position:fixed;
top:-10px;
width:10px;
height:10px;
animation:cair 3s linear forwards;
z-index:3;
}
@keyframes subir{ 
  to{ transform:translateY(-120vh); } 
}
@keyframes brilhar{ 
  from{box-shadow:0 0 20px #fff;} 
  to{box-shadow:0 0 40px #ff69b4;} 
}
@keyframes cair{ 
  to{ transform:translateY(100vh) rotate(720deg); opacity:0; } 
}
</style>
</head>
<body>

<script>
// Criar balões
for(let i=0; i<20; i++){
let balao = document.createElement('div');
balao.classList.add('balao');
balao.style.left = Math.random()*100 + 'vw';
balao.style.background = `hsl(${Math.random()*360}, 100%, 70%)`;
balao.style.animationDelay = Math.random()*5 + 's';
balao.style.width = 30 + Math.random()*20 + 'px';
balao.style.height = 50 + Math.random()*20 + 'px';
document.body.appendChild(balao);
}

// Função da surpresa
function surpresa(){
alert('Parabéns, Maria Antônia! Que você tenha um aniversário maravilhoso e cheio de magia! 🎁✨');
for(let i=0; i<150; i++){
  let confete = document.createElement('div');
  confete.classList.add('confete');
  confete.style.left=Math.random()*100+'vw';
  confete.style.background=`hsl(${Math.random()*360},100%,50%)`;
  confete.style.animationDelay = Math.random()*0.5 + 's';
  document.body.appendChild(confete);
  setTimeout(()=>confete.remove(),3500);
}
}
</script>

<div class="card">
<h1>🎉 Feliz Aniversário! 🎂</h1>
<h2>Maria Antônia</h2>
<h3>7 aninhos 💖</h3>
<p>Que seu dia seja cheio de alegria, brincadeiras, aventuras e muitos presentes!</p>
<button onclick="surpresa()">🎁 Abrir Surpresa</button>
</div>

<audio autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

</body>
</html>
